# Deny all attempts to access hidden files such as .htaccess, .htpasswd, .DS_Store (Mac).
# Keep logging the requests to parse later (or to pass to firewall utilities such as fail2ban)
location ~* /\.(?!well-known\/) {
	deny all;
}

# Prevent access to certain file extensions
location ~\.(ini|log|conf)$ {
	deny all;
}

# Deny direct download of database dumps, archives, and backup files.
# This MUST be included before static-files.conf (which serves bare .gz), and it
# is (see defaults.conf include order); the specific .sql.gz/.tar.gz patterns here
# win over the generic gz rule. Defense in depth: backups are staged outside the
# web root, but a stray dump/archive here must never be downloadable.
# Bare .gz is intentionally NOT blocked (static-files.conf serves it). If a site
# legitimately serves .zip downloads as static files, narrow this rule for it.
location ~* \.(sql|sql\.gz|sql\.bz2|tar|tar\.gz|tgz|zip|bak|swp|save|orig)$ {
	deny all;
}

# Deny access to any files with a .php extension in the uploads directory
# Works in sub-directory installs and also in multisite network
# Keep logging the requests to parse later (or to pass to firewall utilities such as fail2ban)
location ~* /(?:uploads|files)/.*\.php$ {
	deny all;
}